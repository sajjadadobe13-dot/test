name: peerdesk_mobile
description: "PeerDesk mobile - consent-first remote desktop & file sharing for Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Wire-compatible crypto with the Python PC host (X25519, HKDF, Fernet, PBKDF2)
  cryptography: ^2.7.0
  # Pick local files to send to the remote PC
  file_picker: ^8.1.0
  # Resolve a downloads directory for files received from the PC
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
