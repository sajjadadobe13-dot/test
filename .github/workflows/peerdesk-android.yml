name: PeerDesk Android APK

# Builds the PeerDesk mobile app and publishes an installable APK as a
# downloadable artifact. Runs on GitHub-hosted runners, which have the Android
# SDK and full access to Google's servers (the cloud dev sandbox blocks
# dl.google.com, so the APK is produced here instead).

on:
  push:
    paths:
      - 'peerdesk/mobile/**'
      - '.github/workflows/peerdesk-android.yml'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: peerdesk/mobile

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK (universal, debug-signed, installable)
        run: flutter build apk --release

      - name: Build per-ABI APKs (smaller downloads)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: peerdesk-apk
          path: |
            peerdesk/mobile/build/app/outputs/flutter-apk/app-release.apk
            peerdesk/mobile/build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error
          retention-days: 30
